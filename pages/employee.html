<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Portal - HCM Lite</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-building-user brand-icon"></i>
                <h2>HCM Lite <span class="role-badge">Staff</span></h2>
            </div>
            <ul class="nav-links">
                <li><a href="employee.html" class="active"><i class="fa-solid fa-house-user"></i> My Portal</a></li>
                <li><a href="payslip.html"><i class="fa-solid fa-file-invoice-dollar"></i> My Payslip</a></li>
            </ul>
            <div class="user-profile-summary">
                <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-info">
                    <span id="emp-portal-name">Employee</span>
                    <small id="emp-portal-dept">Department</small>
                </div>
                <a href="../index.html" class="logout-btn"><i class="fa-solid fa-arrow-right-from-bracket"></i></a>
            </div>
        </nav>

        <main class="main-content">
            <header class="top-bar">
                <div class="header-title">
                    <h1>Employee Self-Service</h1>
                    <p>Mark daily attendance and apply for leaves</p>
                </div>
                <div class="top-bar-right">
                    <button class="theme-toggle-btn" title="Toggle Dark/Light Mode">
                        <i class="fa-solid fa-moon"></i> <span>Dark Mode</span>
                    </button>
                </div>
            </header>

            <div class="cards-grid">
                <div class="card card-blue">
                    <div class="card-icon"><i class="fa-solid fa-clock"></i></div>
                    <div class="card-data">
                        <h3>Attendance Status</h3>
                        <p id="today-status">Not Checked In</p>
                    </div>
                </div>
                <div class="card card-green">
                    <div class="card-icon"><i class="fa-solid fa-umbrella-beach"></i></div>
                    <div class="card-data">
                        <h3>Leave Balance</h3>
                        <p id="leave-balance-count">12 Days</p>
                    </div>
                </div>
            </div>

            <div class="dashboard-grid">
                <div class="panel-box">
                    <div class="panel-header">
                        <h2><i class="fa-solid fa-camera"></i> Attendance Check-In / Out</h2>
                    </div>
                    <p style="margin-bottom: 16px; color: var(--text-muted);">Simulated office zone camera detection.</p>
                    <div style="display: flex; gap: 12px;">
                        <button id="checkin-btn" class="btn btn-success"><i class="fa-solid fa-right-to-bracket"></i> Check In</button>
                        <button id="checkout-btn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Check Out</button>
                    </div>
                </div>

                <div class="panel-box">
                    <div class="panel-header">
                        <h2><i class="fa-solid fa-pen-to-square"></i> Apply Leave</h2>
                    </div>
                    <form id="apply-leave-form">
                        <div class="form-group">
                            <label>From Date</label>
                            <input type="date" id="leave-from" required>
                        </div>
                        <div class="form-group">
                            <label>To Date</label>
                            <input type="date" id="leave-to" required>
                        </div>
                        <div class="form-group">
                            <label>Reason</label>
                            <input type="text" id="leave-reason" placeholder="Sick / Family Event" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Submit Application</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/employee.js"></script>
</body>
</html>
